<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SIAG - Sistem Informasi Administrasi Guru</title>

  <!-- Google Fonts: Inter (400, 500, 600, 700) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Design System Stylesheet -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Topbar Mobile & Tablet (< 1024px) -->
  <header id="topbar">
    <div class="topbar-brand">SIAG</div>
    <button class="btn-ghost" onclick="App.showMobileMenu()" aria-label="Menu Akun">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/>
      </svg>
    </button>
  </header>

  <div id="app-container">
    <!-- Sidebar Desktop (>= 1024px) -->
    <aside id="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-logo">S</div>
        <div class="sidebar-title">
          <h2>SIAG</h2>
          <p>Administrasi Guru</p>
        </div>
      </div>

      <!-- Item Navigasi Berdasarkan Peran -->
      <nav class="sidebar-nav" id="sidebar-nav-container">
        <!-- Dihasilkan secara dinamis oleh App.renderShell() -->
      </nav>

      <!-- Profil & Menu Pengguna -->
      <div class="sidebar-footer">
        <div class="user-profile">
          <div class="user-avatar" id="sidebar-user-avatar">U</div>
          <div class="user-info">
            <div class="user-name" id="sidebar-user-name">Pengguna</div>
            <div class="user-role-badge" id="sidebar-user-role">Guru</div>
          </div>
        </div>
        <button class="btn btn-secondary btn-full" style="height: 38px; font-size: 13px;" onclick="App.navigate('#/ganti-password')">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="7.5" cy="15.5" r="5.5"/><path d="m21 2-9.6 9.6"/><path d="m15.5 7.5 3 3L22 7l-3-3"/></svg>
          <span>Ganti Password</span>
        </button>
        <button class="btn btn-ghost btn-full" style="height: 38px; font-size: 13px; color: var(--color-danger);" onclick="App.logout()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/></svg>
          <span>Keluar</span>
        </button>
      </div>
    </aside>

    <!-- Konten Utama Layar Aktif -->
    <main id="main-content" role="main">
      <!-- Layar aktif dimuat di sini -->
    </main>
  </div>

  <!-- Bottom Navigation Mobile (< 640px) -->
  <nav id="bottom-nav">
    <!-- Dihasilkan secara dinamis oleh App.renderShell() -->
  </nav>

  <!-- Kontainer Notifikasi Toast -->
  <div id="toast-container" aria-live="polite"></div>

  <!-- Core Scripts -->
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>

  <!-- Modul Layar (S01 – S20) -->
  <script src="js/components/s01_login.js"></script>
  <script src="js/components/s02_change_password.js"></script>
  <script src="js/components/s03_dashboard_guru.js"></script>
  <script src="js/components/s04_dashboard_admin.js"></script>
  <script src="js/components/s05_dashboard_kepsek.js"></script>
  <script src="js/components/s06_presensi.js"></script>
  <script src="js/components/s07_rekap_presensi.js"></script>
  <script src="js/components/s08_penilaian.js"></script>
  <script src="js/components/s09_rekap_nilai.js"></script>
  <script src="js/components/s10_rapor.js"></script>
  <script src="js/components/s11_jurnal.js"></script>
  <script src="js/components/s12_jurnal_pantauan.js"></script>
  <script src="js/components/s13_perangkat_ajar.js"></script>
  <script src="js/components/s14_telaah_perangkat.js"></script>
  <script src="js/components/s15_siswa.js"></script>
  <script src="js/components/s16_impor_csv.js"></script>
  <script src="js/components/s17_master_akademik.js"></script>
  <script src="js/components/s18_penugasan.js"></script>
  <script src="js/components/s19_akun.js"></script>
  <script src="js/components/s20_pengaturan.js"></script>

  <!-- Inisialisasi Aplikasi -->
  <script>
    document.addEventListener("DOMContentLoaded", function() {
      App.init();
    });
  </script>
</body>
</html>
